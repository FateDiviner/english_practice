# 前端容器内的 Nginx 配置：托管 SPA 静态文件，并把 /api 与 /mcp 反代到后端容器。
# 后端地址通过 compose 注入的环境变量 BACKEND_UPSTREAM 指定（nginx:1.27 支持 envsubst 模板）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 词书导入接口单文件上限 10MB，这里留出余量。
    client_max_body_size 20m;
    client_body_timeout 60s;

    # 统一的访问日志格式，便于排查。
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---- 容器健康检查 ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---- 后端 API ----
    # 需要保留 /api/v1 前缀，后端路由本身就挂在 /api/v1 下。
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM}:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 对话是 SSE 流式响应，必须关闭缓冲并放宽超时。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- MCP 端点（Streamable HTTP） ----
    location /mcp {
        proxy_pass http://${BACKEND_UPSTREAM}:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP 使用 SSE 回传，逐跳转发，禁止缓冲改写。
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- 带哈希的静态资源，可长期缓存 ----
    # 文件名带内容哈希，因此可以安全地设为不可变缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- SPA 路由回退：history 模式，未命中文件时返回 index.html ----
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
