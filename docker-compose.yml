# 生产 Docker Compose 编排：MySQL 8 + 后端 FastAPI + 前端 Nginx。
# 使用方式见 docs/docker-deployment.md。
# 所有敏感配置从同目录 .env 读取（由 docker.env.example 复制而来）。

name: english-practice

services:
  db:
    image: mysql:8.0
    container_name: english-practice-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-english_practice}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # 默认只绑定回环地址，避免数据库直接暴露公网；需要外部连接时改成 "3306:3306"。
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - app_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: english-practice-backend:${IMAGE_TAG:-latest}
    container_name: english-practice-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 容器内通过服务名访问数据库，覆盖 .env 里给本机开发用的 127.0.0.1。
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-app}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-english_practice}?charset=utf8mb4
      TZ: ${TZ:-Asia/Shanghai}
      PORT: 8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_ADMIN: ${SEED_ADMIN:-true}
    volumes:
      # 系统语音（SAPI）合成的 WAV 缓存；容器内为 Windows 语音不可用时该目录为空。
      - tts_cache:/app/var/tts
    expose:
      - "8000"
    ports:
      # 仅本机可访问，方便调试与直接访问 /docs；对外统一走前端 Nginx。
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 生产环境走同源相对路径，由 Nginx 反代到 backend 容器。
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: english-practice-frontend:${IMAGE_TAG:-latest}
    container_name: english-practice-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: backend
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      - app_net

volumes:
  db_data:
    name: english-practice-db-data
  tts_cache:
    name: english-practice-tts-cache

networks:
  app_net:
    name: english-practice-net
    driver: bridge
