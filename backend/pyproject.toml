[project]
name = "english-practice-backend"
version = "0.1.0"
description = "English practice platform backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic",
    "asyncmy",
    "bcrypt>=5.0.0",
    "fastapi",
    "httpx>=0.28.1",
    "langsmith>=0.5.0",
    "mcp>=2.3,<3",
    "openpyxl>=3.1.5",
    "pydantic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]",
    "uvicorn",
]

[dependency-groups]
dev = [

    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
