[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-practice-core"
version = "1.7.0"
description = "英语练习平台共享核心层：数据模型、连接、配置与账号校验"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-jose[cryptography]>=3.3",
  "passlib>=1.7",
  "bcrypt>=4.0",
]

# 只打包共享层：backend/ 与 admin-api/ 仍以各自目录为运行入口
[tool.setuptools]
packages = ["core", "core.models", "core.services"]
